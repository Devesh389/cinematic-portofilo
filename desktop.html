<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Devesh Sarkaar | Cinematic Portfolio</title><meta name="theme-color" content="#02070a"><style>
@font-face{font-family:Oswald;src:url('public/fonts/oswald-500.woff2')}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02070a;color:#b4c4c8;font-family:Oswald,Arial,sans-serif}body{background:radial-gradient(ellipse at 50% 50%,#08242c 0%,#030b10 48%,#010407 100%)}.ambient{position:fixed;inset:0;opacity:.2;background:linear-gradient(90deg,#02070a88,transparent 40%,transparent 60%,#02070a88),url('public/media/2-founder-trial-poster.jpg') center/cover;filter:blur(65px);transform:scale(1.15);pointer-events:none}.stage{position:absolute;left:50%;top:0;transform:translateX(-50%);width:min(100vw,560px,46.18svh);height:100svh;background:#02070a;box-shadow:0 0 0 1px #61ddf318,0 0 90px #000b;overflow:hidden}.stage iframe{display:block;border:0;width:100%;height:100%;background:#02070a}.side{position:absolute;left:6vw;top:50%;transform:translateY(-50%);max-width:20vw}.side p{font-size:11px;letter-spacing:.32em;color:#6d8d96;text-transform:uppercase}.side h1{font-size:clamp(22px,2.5vw,46px);line-height:1.12;font-weight:500;letter-spacing:.05em;margin:14px 0;color:#d9eff4}.line{width:40px;height:1px;background:#19e6ff66;margin:24px 0}.right{left:auto;right:6vw;text-align:right;font-size:11px;line-height:2;letter-spacing:.22em;text-transform:uppercase;color:#6d8d96}.right a{color:#9abac4;text-decoration:none;display:block;margin-top:24px}.right a:hover{color:#19e6ff}@media(max-width:1050px){.side{left:3vw;max-width:18vw}.right{left:auto;right:3vw;font-size:9px;letter-spacing:.13em}.side h1{font-size:22px}}@media(max-aspect-ratio:1/1),(max-width:899px){.stage{width:100vw}.side{display:none}}
</style></head><body><div class="ambient" aria-hidden="true"></div><aside class="side"><p>Developer · Founder · Storyteller</p><h1>DEVESH<br>SARKAAR</h1><div class="line"></div><p>A cinematic portfolio</p></aside><main class="stage"><iframe id="experience" title="Devesh Sarkaar interactive portfolio" allow="autoplay; fullscreen" src="index.html?portrait=1"></iframe></main><aside class="side right">The story plays itself<br>Click inside to enable sound<a id="switch" href="desktop.html?view=founder">Meet the founder &rarr;</a></aside><script>
const founder=new URLSearchParams(location.search).get('view')==='founder';
const frame=document.getElementById('experience');
frame.src=(founder?'founder.html':'index.html')+'?portrait=1&v=desktop1';
if(founder){document.querySelector('.ambient').style.backgroundImage="url('public/media/9-holohero.jpg')";const a=document.getElementById('switch');a.href='desktop.html?view=main';a.textContent='Back to the portfolio';}
frame.addEventListener('load',()=>{try{const isFounder=frame.contentWindow.location.pathname.endsWith('founder.html');const a=document.getElementById('switch');a.href='desktop.html?view='+(isFounder?'main':'founder');a.textContent=isFounder?'Back to the portfolio':'Meet the founder →';frame.contentDocument.querySelectorAll('a[href]').forEach(a=>{const u=new URL(a.href);if(u.origin!==location.origin&&['http:','https:'].includes(u.protocol)){a.target='_blank';a.rel='noopener'}})}catch{}});
</script></body></html>
